<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Book an appointment · {{.Clinic}}</title>
<style>
  :root { --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f9fafb; --card:#fff; --accent:#0f766e; --accent-fg:#fff; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#f3f4f6; --muted:#9ca3af; --line:#374151; --bg:#0b0f14; --card:#111827; --accent:#2dd4bf; --accent-fg:#042f2e; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1.05rem; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:.9rem; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:12px 0 4px; }
  select, input[type=text], input[type=tel], input[type=date] { width:100%; padding:10px 12px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  .times { display:grid; grid-template-columns:repeat(auto-fill, minmax(88px, 1fr)); gap:8px; }
  .times button { padding:10px 0; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .times button[aria-pressed=true] { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .check { display:flex; gap:8px; align-items:flex-start; font-weight:400; }
  .check input { margin-top:4px; }
  .primary { margin-top:16px; width:100%; padding:12px; font:inherit; font-weight:600; color:var(--accent-fg); background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  .primary:disabled { opacity:.5; cursor:not-allowed; }
  .error { color:var(--err); margin-top:12px; }
  .ref { font-size:1.6rem; font-weight:700; letter-spacing:.08em; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main data-testid="book-page">
  <h1>{{.Clinic}}</h1>
  <p class="muted">Book an appointment online.</p>

  <section id="choose" aria-labelledby="h-choose">
    <h2 id="h-choose">1. What and where</h2>
    <label for="service">Service</label>
    <select id="service" data-testid="book-service"></select>
    <label for="location">Location</label>
    <select id="location" data-testid="book-location"></select>
    <label for="practitioner">Practitioner</label>
    <select id="practitioner" data-testid="book-practitioner"></select>
    <label for="day">Day</label>
    <input id="day" type="date" data-testid="book-day">
  </section>

  <section aria-labelledby="h-time">
    <h2 id="h-time">2. Time</h2>
    <div id="times" class="times" role="group" aria-labelledby="h-time" data-testid="book-times"></div>
    <p id="no-times" class="muted" hidden>No times free that day. Try another day.</p>
  </section>

  <section id="details" aria-labelledby="h-details" hidden>
    <h2 id="h-details">3. Your details</h2>
    <form id="form" novalidate>
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="name" maxlength="120" required data-testid="book-name">
      <label for="mobile">Mobile</label>
      <input id="mobile" type="tel" autocomplete="tel" inputmode="tel" placeholder="0412 345 678" required data-testid="book-mobile">
      <label class="check"><input id="notice" type="checkbox" required data-testid="book-notice"><span id="notice-text"></span></label>
      <div id="captcha" data-testid="book-captcha"></div>
      <button id="submit" class="primary" type="submit" data-testid="book-submit">Book</button>
      <p id="error" class="error" role="alert" data-testid="book-error"></p>
    </form>
  </section>

  <section id="done" aria-live="polite" hidden data-testid="book-done">
    <h2>You're booked</h2>
    <p>Your reference</p>
    <p class="ref" id="ref" data-testid="book-ref"></p>
    <p id="summary"></p>
    <p class="muted">Please quote your reference if you need to change or cancel, and call the clinic.</p>
  </section>
</main>
<script nonce="{{.Nonce}}">
(function () {
  "use strict";
  var api = {{.API}};
  var siteKey = {{.SiteKey}};
  var info = null, chosen = null, captchaToken = "";
  var $ = function (id) { return document.getElementById(id); };

  function get(path) {
    return fetch(api + path, { credentials: "omit" }).then(read);
  }
  function read(res) {
    return res.json().then(function (body) {
      if (body.status !== "success") { throw new Error(body.message || "Something went wrong. Please try again."); }
      return body.data;
    });
  }
  function option(select, value, text) {
    var o = document.createElement("option"); o.value = value; o.textContent = text; select.appendChild(o);
  }
  function money(cents) { return cents == null ? "" : " · $" + (cents / 100).toFixed(2); }
  function todayIn(tz) {
    var p = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    return p;
  }

  function fillPractitioners() {
    var svc = $("service").value, loc = $("location").value, sel = $("practitioner");
    sel.innerHTML = ""; option(sel, "", "Anyone available");
    info.practitioners.forEach(function (p) {
      if (p.location_ids.indexOf(loc) >= 0 && p.service_ids.indexOf(svc) >= 0) { option(sel, p.id, p.display_name + " (" + p.role + ")"); }
    });
  }

  function loadTimes() {
    chosen = null; $("details").hidden = true;
    var box = $("times"); box.innerHTML = ""; $("no-times").hidden = true;
    if (!$("service").value || !$("location").value || !$("day").value) { return; }
    var q = "/slots?service_id=" + encodeURIComponent($("service").value) + "&location_id=" + encodeURIComponent($("location").value) +
      "&date=" + encodeURIComponent($("day").value);
    if ($("practitioner").value) { q += "&practitioner_id=" + encodeURIComponent($("practitioner").value); }
    get(q).then(function (d) {
      $("no-times").hidden = d.slots.length > 0;
      d.slots.forEach(function (s) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = s.local.slice(11); b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", function () {
          Array.prototype.forEach.call(box.children, function (c) { c.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true"); chosen = s; $("details").hidden = false; $("name").focus();
        });
        box.appendChild(b);
      });
    }).catch(function (e) { $("no-times").hidden = false; $("no-times").textContent = e.message; });
  }

  window.onTurnstile = function () {
    if (!siteKey || !window.turnstile) { return; }
    window.turnstile.render("#captcha", { sitekey: siteKey, callback: function (t) { captchaToken = t; },
      "expired-callback": function () { captchaToken = ""; } });
  };

  get("").then(function (d) {
    info = d;
    $("notice-text").textContent = d.notice;
    d.services.forEach(function (s) { option($("service"), s.id, s.name + " · " + s.duration_minutes + " min" + money(s.price_cents)); });
    d.locations.forEach(function (l) { option($("location"), l.id, l.name + (l.address ? " — " + l.address : "")); });
    $("day").value = todayIn(d.clinic.time_zone); $("day").min = $("day").value;
    fillPractitioners(); loadTimes();
    if (siteKey) {
      var s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstile&render=explicit";
      s.async = true; s.defer = true; s.nonce = {{.Nonce}}; document.head.appendChild(s);
    } else {
      $("error").textContent = "Online booking isn't set up yet. Please call the clinic.";
      $("submit").disabled = true;
    }
  }).catch(function (e) { document.querySelector("main").innerHTML = "<h1>Booking</h1><p></p>"; document.querySelector("main p").textContent = e.message; });

  ["service", "location"].forEach(function (id) { $(id).addEventListener("change", function () { fillPractitioners(); loadTimes(); }); });
  ["practitioner", "day"].forEach(function (id) { $(id).addEventListener("change", loadTimes); });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    $("error").textContent = "";
    if (!chosen) { $("error").textContent = "Please pick a time."; return; }
    $("submit").disabled = true;
    fetch(api + "/appointments", {
      method: "POST", credentials: "omit", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: $("service").value, location_id: $("location").value,
        practitioner_id: $("practitioner").value || (chosen.practitioner_ids.length === 1 ? chosen.practitioner_ids[0] : null),
        starts_at: chosen.starts_at, name: $("name").value, mobile: $("mobile").value,
        notice_accepted: $("notice").checked, captcha_token: captchaToken
      })
    }).then(read).then(function (r) {
      $("choose").hidden = true; document.querySelectorAll("section")[1].hidden = true; $("details").hidden = true;
      $("ref").textContent = r.reference;
      $("summary").textContent = r.service + " with " + r.practitioner + ", " + r.label + " at " + r.location + (r.address ? " (" + r.address + ")" : "") + ".";
      $("done").hidden = false; $("done").focus();
    }).catch(function (e) {
      $("error").textContent = e.message; $("submit").disabled = false;
      if (window.turnstile) { window.turnstile.reset(); captchaToken = ""; }
      loadTimes();
    });
  });
})();
</script>
</body>
</html>
