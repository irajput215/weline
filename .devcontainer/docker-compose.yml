# Weline dev environment for GitHub Codespaces / VS Code Dev Containers.
#
# app   - the workspace container (Go + Node), where you run `make dev`
# db    - PostgreSQL, reachable from app as host "db"
# redis - Redis, reachable from app as host "redis"
#
# The hostnames match config.example.toml, so the copied config.toml works
# without edits.
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatomate
      POSTGRES_PASSWORD: whatomate
      POSTGRES_DB: whatomate
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres-data:
